name: Release

# Builds the Windows binaries, packages the installer zip and publishes a
# GitHub release named after dist/windows/VERSION.txt. Either push a tag like
# v0.2.0 (it must match VERSION.txt), or run this workflow by hand from the
# Actions tab: it then creates the v<VERSION.txt> tag on the chosen branch.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  windows:
    name: Windows package

    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: MSYS2 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            git
            zip
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Configure
        run: |
          cmake -S . -B build-win -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_EXE_LINKER_FLAGS="-static -static-libgcc -static-libstdc++" \
            -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_C_FLAGS=-std=gnu17

      - name: Build
        run: |
          cmake --build build-win --target f2_server fallout2-ce -j 4

      - name: Version
        id: version
        run: |
          want="$(head -n1 dist/windows/VERSION.txt | tr -d '\r\n ')"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$want" ]; then
            echo "Tag $GITHUB_REF_NAME does not match dist/windows/VERSION.txt ($want)" >&2
            exit 1
          fi
          echo "tag=v$want" >> "$GITHUB_OUTPUT"

      - name: Package
        run: |
          scripts/package-windows.sh build-win out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: supercoop-windows
          path: out/*.zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Fallout 2 SuperCoop ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: dist/windows/RELEASE_NOTES.md
          files: out/*.zip

  docker:
    name: Server image (ghcr.io)

    runs-on: ubuntu-latest

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Version
        id: version
        run: |
          echo "version=$(head -n1 dist/windows/VERSION.txt | tr -d '\r\n ')" >> "$GITHUB_OUTPUT"

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: fo2-dedicated-server
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fallout2-supercoop-server:latest
            ghcr.io/${{ github.repository_owner }}/fallout2-supercoop-server:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
